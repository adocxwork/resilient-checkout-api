version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: order-process-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: checkout_user
      POSTGRES_PASSWORD: checkout_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
