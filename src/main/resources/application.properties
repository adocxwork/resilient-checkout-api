spring.application.name=resilient-checkout-api
server.address=127.0.0.1
server.error.include-message=never
spring.servlet.multipart.enabled=false
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.factory.constraints.read.max-document-length=16384
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false
spring.datasource.url=${CHECKOUT_DB_URL:jdbc:postgresql://localhost:5433/orderdb}
spring.datasource.username=${CHECKOUT_DB_USER:checkout_user}
spring.datasource.password=${CHECKOUT_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.jdbc.template.query-timeout=3s
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

checkout.auth.alice-username=${CHECKOUT_ALICE_USERNAME:alice}
checkout.auth.bob-username=${CHECKOUT_BOB_USERNAME:bob}
checkout.auth.alice-password=${CHECKOUT_ALICE_PASSWORD}
checkout.auth.bob-password=${CHECKOUT_BOB_PASSWORD}
checkout.simulation.allow-scenarios=false
checkout.recovery.enabled=true
checkout.recovery.batch-size=25
checkout.recovery.initial-delay-seconds=5
checkout.recovery.lease-seconds=30
checkout.recovery.poll-millis=2000
