name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: checkout_test
          POSTGRES_USER: checkout_ci
          POSTGRES_PASSWORD: checkout_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U checkout_ci -d checkout_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CHECKOUT_TEST_DB_URL: jdbc:postgresql://localhost:5432/checkout_test
      CHECKOUT_TEST_DB_USER: checkout_ci
      CHECKOUT_TEST_DB_PASSWORD: checkout_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify with PostgreSQL
        run: ./mvnw -B -ntp verify
      - name: Start packaged application with Compose
        run: docker compose up --build --wait --wait-timeout 120
      - name: Smoke-test checkout and scheduled payment recovery
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8080
          curl --fail --silent --show-error --user alice:alice-local-demo \
            --json '{"productId":1,"quantity":1}' \
            --header 'Idempotency-Key: ci-smoke' \
            "$base/api/orders" | jq -e '.status == "PAID"'

          id=$(curl --fail --silent --show-error --user alice:alice-local-demo \
            --json '{"productId":1,"quantity":1,"paymentScenario":"TIMEOUT_AFTER_CHARGE"}' \
            --header 'Idempotency-Key: ci-timeout' "$base/api/orders" \
            | jq -er 'select(.status == "PAYMENT_PENDING") | .id')
          for _ in {1..20}; do
            if curl --fail --silent --show-error --user alice:alice-local-demo "$base/api/orders/$id" \
                | jq -e '.status == "PAID" and (.paymentReference | length > 0)'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Print Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose
        if: always()
        run: docker compose down --volumes
